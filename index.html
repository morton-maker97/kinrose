<!doctype html>

<title>kinrose | stream, merch, stay connected</title>
<meta name="description" content="Explore Kinrose's projects and videos. Stay updated with the latest news by signing up for our newsletter." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Only use Tailwind for utility classes in the new admin UI -- disable its CSS
  // reset so it can't override the hand-written styles above for the public site.
  tailwind.config = { corePlugins: { preflight: false } };

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Space+Grotesk&family=DM+Serif+Display&family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #583b1f;
    --text: #eae6e1;
    --text-dim: #cbb9a3;
    --link: #eae6e1;
    --card-bg: #6b4b29;
    --radius: 8px;
    --font-heading: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --max-width: 960px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { opacity: 0.75; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.01em; }

  /* nav */
  .nav { padding: 20px 0; }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; }
  .nav-inner img { height: 32px; width: auto; }
  .nav nav { display: flex; gap: 24px; font-size: 0.95rem; text-transform: lowercase; align-items: center; }
  .nav nav a { opacity: 0.85; }

  /* home */
  .hero { padding: 80px 24px; display: flex; flex-direction: column; gap: 32px; }
  .smart-link { display: inline-block; font-size: 0.9rem; text-transform: lowercase; border-bottom: 1px solid currentColor; width: fit-content; }
  .streaming { font-size: clamp(1.5rem, 5vw, 2.5rem); line-height: 1.4; }
  .streaming a { border-bottom: 2px solid transparent; }
  .streaming a:hover { border-bottom-color: currentColor; opacity: 1; }

  /* project list */
  .list { padding: 48px 24px; display: flex; flex-direction: column; gap: 32px; }
  .entry { background: var(--card-bg); border-radius: var(--radius); padding: 20px; }
  .entry img { max-width: 320px; margin-bottom: 16px; border-radius: var(--radius); }
  time { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
  .entry h2 { margin: 0 0 8px; font-size: 1.6rem; text-transform: lowercase; }
  .more { font-size: 0.85rem; border-bottom: 1px solid currentColor; width: fit-content; display: inline-block; }

  /* project detail */
  .post { padding: 48px 24px; max-width: 640px; margin: 0 auto; }
  .post h1 { text-transform: lowercase; font-size: 2rem; margin-bottom: 4px; }
  .post .cover { margin-bottom: 24px; border-radius: var(--radius); }
  .tracklist { padding-left: 1.2em; margin-bottom: 24px; }
  .tracklist li { margin-bottom: 4px; }
  .body p { margin-bottom: 1.2em; }
  .body .credit { font-size: 0.9rem; color: var(--text-dim); margin-top: -8px; }
  .body .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 16px 0 24px; }
  .body .gallery img { border-radius: var(--radius); }
  .body img { border-radius: var(--radius); margin: 16px 0; }
  .body a { border-bottom: 1px solid currentColor; }
  .pager { display: flex; justify-content: space-between; margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(234, 230, 225, 0.2); font-size: 0.9rem; }

  /* videos */
  .grid { padding: 48px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  .video { background: var(--card-bg); border-radius: var(--radius); padding: 12px; }
  .frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius); overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video p { margin: 10px 0 0; font-size: 0.9rem; }

  /* newsletter */
  .newsletter { padding: 48px 24px 64px; border-top: 1px solid rgba(234, 230, 225, 0.2); margin-top: 64px; }
  .newsletter form { display: flex; flex-wrap: wrap; gap: 12px; max-width: 480px; }
  .newsletter label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; flex: 1 1 140px; }
  .newsletter input { padding: 8px 10px; border: 1px solid rgba(234, 230, 225, 0.4); background: transparent; color: var(--text); border-radius: 4px; font-size: 0.95rem; }
  .newsletter button { padding: 8px 20px; border: 1px solid var(--text); background: var(--text); color: var(--bg); border-radius: 4px; cursor: pointer; font-size: 0.95rem; align-self: flex-end; }
  .newsletter button:hover { opacity: 0.85; }
  #newsletter-status { width: 100%; font-size: 0.85rem; min-height: 1.2em; }

  .loading, .error { padding: 48px 24px; color: var(--text-dim); }

  /* content blocks + admin UI (Tailwind-assisted) */
  .zone { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
  .block-wrap { position: relative; }
  .block-text p { margin: 0 0 0.8em; }
  .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; }
  .card img { border-radius: var(--radius); margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; text-transform: lowercase; }
  .block-image { border-radius: var(--radius); }

  input[type=color] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 6px; padding: 0; background: none; }
  input[type=color]::-webkit-color-swatch { border-radius: 6px; border: 1px solid rgba(0,0,0,0.2); }

  /* Tailwind's "flex" utility on the modals ties with the native [hidden] rule in specificity
     and wins (author styles beat the browser's UA default either way) -- force hidden to actually hide. */
  [hidden] { display: none !important; }
</style>

  <div class="flex items-center justify-between mb-4">

  <div>
    <div class="grid grid-cols-2 gap-4">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dateFmt(iso, opts) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', opts);
}

function showModal(id) { document.getElementById(id).hidden = false; }
function hideModal(id) { document.getElementById(id).hidden = true; }

/* ---------- theme ---------- */

const FONT_STACKS = {
  system: "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif",
  playfair: "'Playfair Display', serif",
  spacegrotesk: "'Space Grotesk', sans-serif",
  dmserif: "'DM Serif Display', serif",
  inter: "'Inter', sans-serif",
  poppins: "'Poppins', sans-serif",
};

const DEFAULT_THEME = {
  bg_color: '#583b1f', text_color: '#eae6e1', text_dim_color: '#cbb9a3', link_color: '#eae6e1',
  card_bg_color: '#6b4b29', radius: '8px', heading_font: 'system', body_font: 'system',
  hero_link_text: 'latest release: rated pg', hero_link_href: 'https://too.fm/ratedpg',
};

let theme = DEFAULT_THEME;

function applyTheme(t) {
  const root = document.documentElement;
  root.style.setProperty('--bg', t.bg_color);
  root.style.setProperty('--text', t.text_color);
  root.style.setProperty('--text-dim', t.text_dim_color);
  root.style.setProperty('--link', t.link_color);
  root.style.setProperty('--card-bg', t.card_bg_color);
  root.style.setProperty('--radius', t.radius);
  root.style.setProperty('--font-heading', FONT_STACKS[t.heading_font] || FONT_STACKS.system);
  root.style.setProperty('--font-body', FONT_STACKS[t.body_font] || FONT_STACKS.system);
}

async function fetchTheme() {
  const { data } = await supa.from('site_theme').select('*').eq('id', 1).maybeSingle();
  // Merge over defaults so a column added after your site was set up (e.g. hero_link_text)
  // doesn't come back undefined and break things before you've run that migration.
  theme = { ...DEFAULT_THEME, ...(data || {}) };
  applyTheme(theme);
}

const THEME_FIELD_IDS = ['theme-bg', 'theme-text', 'theme-text-dim', 'theme-link', 'theme-card-bg', 'theme-radius', 'theme-heading-font', 'theme-body-font'];

function readThemeForm() {
  return {
    bg_color: document.getElementById('theme-bg').value,
    text_color: document.getElementById('theme-text').value,
    text_dim_color: document.getElementById('theme-text-dim').value,
    link_color: document.getElementById('theme-link').value,
    card_bg_color: document.getElementById('theme-card-bg').value,
    radius: document.getElementById('theme-radius').value,
    heading_font: document.getElementById('theme-heading-font').value,
    body_font: document.getElementById('theme-body-font').value,
  };
}

// Every field change previews instantly on the live page -- nothing is saved until "Save for everyone".
function previewTheme() {
  applyTheme(readThemeForm());
}

THEME_FIELD_IDS.forEach((id) => {
  const el = document.getElementById(id);
  el.addEventListener('input', previewTheme);
  el.addEventListener('change', previewTheme);
});

function openThemeDrawer() {
  document.getElementById('theme-bg').value = theme.bg_color;
  document.getElementById('theme-text').value = theme.text_color;
  document.getElementById('theme-text-dim').value = theme.text_dim_color;
  document.getElementById('theme-link').value = theme.link_color;
  document.getElementById('theme-card-bg').value = theme.card_bg_color;
  document.getElementById('theme-radius').value = theme.radius;
  document.getElementById('theme-heading-font').value = theme.heading_font;
  document.getElementById('theme-body-font').value = theme.body_font;
  document.getElementById('theme-drawer').classList.remove('translate-x-full');
}

function closeThemeDrawer() {
  applyTheme(theme); // discard any unsaved live preview, revert to what's actually saved
  document.getElementById('theme-drawer').classList.add('translate-x-full');
}

async function saveTheme() {
  const updated = readThemeForm();
  const statusEl = document.getElementById('theme-save-status');
  const { error } = await supa.from('site_theme').update(updated).eq('id', 1);
  if (error) { statusEl.textContent = 'Could not save: ' + error.message; return; }
  theme = updated;
  applyTheme(theme);
  statusEl.textContent = 'Saved.';
  setTimeout(() => { statusEl.textContent = ''; }, 2000);
}

/* ---------- admin / auth ---------- */

let isAdmin = false;

async function refreshAdminState() {
  const { data: sessionData } = await supa.auth.getSession();
  if (!sessionData.session) { isAdmin = false; return; }
  const { data, error } = await supa.rpc('is_admin');
  isAdmin = !error && data === true;
}

function renderAdminChrome() {
  const slot = document.getElementById('admin-nav-slot');
  if (slot) {
    slot.innerHTML = isAdmin
      ? `<a href="#" data-action="theme-open">theme</a><a href="#" data-action="logout">logout</a>`
      : `<a href="#" data-action="login-open">admin</a>`;
  }
  const banner = document.getElementById('admin-banner');
  if (banner) {
    banner.hidden = !isAdmin;
    document.body.classList.toggle('pt-9', isAdmin);
  }
}

supa.auth.onAuthStateChange(async () => {
  await refreshAdminState();
  renderAdminChrome();
  router();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const { error } = await supa.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
  const err = document.getElementById('login-error');
  if (error) { err.textContent = error.message; return; }
  err.textContent = '';
  e.target.reset();
  hideModal('login-modal');
});

/* ---------- content blocks ---------- */

let editingBlockId = null;
let addingToZone = null;
let addingType = null;
let zoneBlockOrder = {}; // zone -> array of block ids, in last-rendered order (used for drag-and-drop)
let draggedBlockId = null;

/* ---------- editing the originally-migrated content ---------- */

let editingProjectId = null;
let addingProject = false;
let editingTrackId = null;
let addingTrackForProject = null;
let editingVideoId = null;
let addingVideo = false;
let editingStreamingLinkId = null;
let addingStreamingLink = false;
let editingHeroLink = false;

function extractYoutubeId(input) {
  input = (input || '').trim();
  try {
    const url = new URL(input);
    const host = url.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') return url.pathname.slice(1);
    if (host === 'youtube.com') return url.searchParams.get('v') || input;
  } catch (e) { /* not a URL -- assume it's already just the video id */ }
  return input;
}

// zoneColumn/zoneValue scope the reorder to siblings sharing that value (e.g. tracks within
// one project); pass zoneColumn as null for tables with no such grouping (projects, videos,
// streaming_links), which reorders against every row in the table.
async function moveRow(table, id, zoneColumn, zoneValue, orderColumn, dir) {
  let query = supa.from(table).select(`id, ${orderColumn}`).order(orderColumn, { ascending: true });
  if (zoneColumn) query = query.eq(zoneColumn, zoneValue);
  const { data: siblings } = await query;
  const idx = siblings.findIndex((s) => s.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;
  const a = siblings[idx], b = siblings[swapIdx];
  await supa.from(table).update({ [orderColumn]: b[orderColumn] }).eq('id', a.id);
  await supa.from(table).update({ [orderColumn]: a[orderColumn] }).eq('id', b.id);
}

async function collectProjectForm(form) {
  const get = (name) => form.querySelector(`[data-field="${name}"]`);
  const fileInput = get('file');
  let coverImage = get('cover_image').value.trim();
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const path = `${Date.now()}-${file.name}`.replace(/\s+/g, '-');
    const { error: upErr } = await supa.storage.from('site-images').upload(path, file, { upsert: true });
    if (upErr) { alert('Image upload failed: ' + upErr.message); return null; }
    coverImage = supa.storage.from('site-images').getPublicUrl(path).data.publicUrl;
  }
  const values = {
    title: get('title').value.trim(),
    slug: get('slug').value.trim(),
    released_on: get('released_on').value,
    cover_image: coverImage,
    cover_link: get('cover_link').value.trim() || null,
    show_tracklist: get('show_tracklist').checked,
  };
  const bodyField = get('body_html');
  if (bodyField) values.body_html = bodyField.value.trim() || null;
  return values;
}

function projectCard(p, admin, isFirst, isLast) {
  const controls = admin ? `
    <div class="flex gap-2 mt-2 text-xs opacity-80">
      <button data-action="project-move-up" data-id="${p.id}" class="px-2 py-1 rounded border border-white/30" ${isFirst ? 'disabled' : ''}>&uarr;</button>
      <button data-action="project-move-down" data-id="${p.id}" class="px-2 py-1 rounded border border-white/30" ${isLast ? 'disabled' : ''}>&darr;</button>
      <button data-action="project-edit-start" data-id="${p.id}" class="px-2 py-1 rounded border border-white/30">Edit</button>
      <button data-action="project-delete" data-id="${p.id}" class="px-2 py-1 rounded border border-white/30">Delete</button>
    </div>` : '';
  return `<article class="entry">
    <time>${dateFmt(p.released_on, { month: 'numeric', day: 'numeric', year: '2-digit' })}</time>
    <a href="#/projects/${p.slug}">
      <img src="${escapeHtml(p.cover_image)}" alt="${escapeHtml(p.title)}" />
      <h2>${escapeHtml(p.title)}</h2>
    </a>
    <a class="more" href="#/projects/${p.slug}">Read More</a>
    ${controls}
  </article>`;
}

function projectForm(p, includeBodyHtml) {
  p = p || { title: '', slug: '', released_on: '', cover_image: '', cover_link: '', show_tracklist: true, body_html: '' };
  const isNew = !p.id;
  const bodyField = includeBodyHtml ? `
    <label class="text-sm block mb-1">Extra content (HTML) -- credits, galleries, writeups</label>
    <textarea data-field="body_html" rows="6" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] text-xs font-mono mb-2">${escapeHtml(p.body_html || '')}</textarea>` : '';
  const deleteBtn = !isNew ? `<button data-action="project-delete" data-id="${p.id}" class="px-3 py-1.5 rounded border border-red-400 text-red-300 text-sm">Delete project</button>` : '<span></span>';
  return `<div class="block-form p-4 rounded border border-dashed border-white/40 mb-4" data-kind="project">
    <input data-field="title" type="text" value="${escapeHtml(p.title)}" placeholder="Title" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />
    <input data-field="slug" type="text" value="${escapeHtml(p.slug)}" placeholder="URL slug (e.g. my-new-ep)" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />
    <p class="text-xs opacity-60 -mt-1 mb-2">Changing the slug changes this project's URL.</p>
    <input data-field="released_on" type="date" value="${escapeHtml(p.released_on || '')}" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />

async function fetchBlocks(zone) {
  const { data, error } = await supa.from('blocks').select('*').eq('zone', zone).order('position', { ascending: true });

}

async function collectBlockContent(form, type) {
  const get = (name) => form.querySelector(`[data-field="${name}"]`);
  const fileInput = get('file');
  let uploadedUrl = null;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const path = `${Date.now()}-${file.name}`.replace(/\s+/g, '-');
    const { error: upErr } = await supa.storage.from('site-images').upload(path, file, { upsert: true });
    if (upErr) { alert('Image upload failed: ' + upErr.message); return null; }
    uploadedUrl = supa.storage.from('site-images').getPublicUrl(path).data.publicUrl;
  }
  if (type === 'text') {
    return { text: (get('text')?.value || '').trim() };
  }
  if (type === 'image') {
    return { url: uploadedUrl || (get('url')?.value || '').trim(), alt: (get('alt')?.value || '').trim() };
  }
  if (type === 'embed') {
    return { url: (get('url')?.value || '').trim(), height: Number(get('height')?.value) || 152 };
  }
  return {
    title: (get('title')?.value || '').trim(),
    body: (get('body')?.value || '').trim(),
    image_url: uploadedUrl || (get('image_url')?.value || '').trim(),
  };
}

// Turns a plain share link (Spotify, Apple Music, SoundCloud, YouTube) into its embeddable
// form. If given a raw <iframe> embed snippet instead, pulls the src out of that. Anything
// else is used as-is, in case it's already a direct embed URL.
function toEmbedSrc(raw) {
  raw = (raw || '').trim();
  const iframeMatch = raw.match(/src=["']([^"']+)["']/i);
  if (iframeMatch) return iframeMatch[1];

  try {
    const url = new URL(raw);
    const host = url.hostname.replace(/^www\./, '');
    if (host === 'open.spotify.com') return raw.replace('open.spotify.com/', 'open.spotify.com/embed/');
    if (host === 'music.apple.com') return raw.replace('music.apple.com', 'embed.music.apple.com');
    if (host === 'soundcloud.com') return `https://w.soundcloud.com/player/?url=${encodeURIComponent(raw)}&color=%23583b1f&auto_play=false`;
    if (host === 'youtube.com') { const id = url.searchParams.get('v'); if (id) return `https://www.youtube.com/embed/${id}`; }
    if (host === 'youtu.be') return `https://www.youtube.com/embed/${url.pathname.slice(1)}`;
  } catch (e) { /* not a parseable URL -- fall through and use it as-is */ }

  return raw;
}

// Shared renderer: used both for a saved block's normal view AND for the live preview
// inside an add/edit form, so the preview always matches exactly what will be saved.
function renderBlockContent(type, content) {
  content = content || {};
  if (type === 'embed') {
    if (!content.url) return '<p class="opacity-50 text-sm">Paste a link below to preview it</p>';
    const height = Number(content.height) || 152;
    return `<iframe src="${escapeHtml(toEmbedSrc(content.url))}" height="${height}" style="width:100%;border:0;border-radius:var(--radius);display:block;" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  }
  if (type === 'text') {
    const paras = (content.text || '').split('\n').filter(Boolean).map((l) => `<p>${escapeHtml(l)}</p>`).join('');
    return `<div class="block-text">${paras || '<p class="opacity-50 text-sm">(empty)</p>'}</div>`;
  }
  if (type === 'image') {
    return content.url
      ? `<img src="${escapeHtml(content.url)}" alt="${escapeHtml(content.alt || '')}" class="block-image" />`
      : '<p class="opacity-50 text-sm">No image yet</p>';
  }
  return `<div class="card">
    ${content.image_url ? `<img src="${escapeHtml(content.image_url)}" alt="" />` : ''}
    ${content.title ? `<h3>${escapeHtml(content.title)}</h3>` : ''}
    ${content.body ? `<p>${escapeHtml(content.body)}</p>` : ''}
    ${!content.image_url && !content.title && !content.body ? '<p class="opacity-50 text-sm">(empty card)</p>' : ''}
  </div>`;
}

function readBlockFormValuesForPreview(form, type) {
  const get = (name) => form.querySelector(`[data-field="${name}"]`);
  const fileInput = get('file');
  const filePreviewUrl = fileInput && fileInput.files && fileInput.files[0] ? URL.createObjectURL(fileInput.files[0]) : null;
  if (type === 'text') return { text: get('text')?.value || '' };
  if (type === 'image') return { url: filePreviewUrl || (get('url')?.value || ''), alt: get('alt')?.value || '' };
  if (type === 'embed') return { url: get('url')?.value || '', height: get('height')?.value || 152 };
  return {
    title: get('title')?.value || '',
    body: get('body')?.value || '',
    image_url: filePreviewUrl || (get('image_url')?.value || ''),
  };
}

// Live-updates a form's preview as any of its fields change -- nothing is saved here.

document.addEventListener('change', handleBlockFormLivePreview);

async function renderZone(zone) {
  const list = await fetchBlocks(zone);
  zoneBlockOrder[zone] = list.map((b) => b.id);
  let html = `<div class="zone" data-zone="${escapeHtml(zone)}">`;
  list.forEach((b, i) => {
    html += isAdmin && editingBlockId === b.id
      ? blockEditForm(b)
      : renderBlockView(b, i === 0, i === list.length - 1);
  });
  if (isAdmin) {
    html += addingToZone === zone
      ? blockAddForm(zone, addingType)
      : `<div class="flex gap-2 text-xs opacity-80">
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="text" class="px-3 py-1.5 rounded border border-white/30">+ Text</button>
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="image" class="px-3 py-1.5 rounded border border-white/30">+ Image</button>
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="card" class="px-3 py-1.5 rounded border border-white/30">+ Card</button>
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="embed" class="px-3 py-1.5 rounded border border-white/30">+ Embed</button>
        </div>`;
  }
  html += '</div>';
  return html;
}

async function moveBlock(id, dir) {
  const { data: current } = await supa.from('blocks').select('zone').eq('id', id).single();
  if (!current) return;
  const { data: siblings } = await supa.from('blocks').select('id, position').eq('zone', current.zone).order('position', { ascending: true });
  const idx = siblings.findIndex((s) => s.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;
  const a = siblings[idx], b = siblings[swapIdx];
  await supa.from('blocks').update({ position: b.position }).eq('id', a.id);
  await supa.from('blocks').update({ position: a.position }).eq('id', b.id);
}

async function dropBlock(zone, draggedId, targetId, insertAfter) {
  const order = (zoneBlockOrder[zone] || []).filter((id) => id !== draggedId);
  const targetIdx = order.indexOf(targetId);
  if (targetIdx === -1) return;
  order.splice(insertAfter ? targetIdx + 1 : targetIdx, 0, draggedId);
  await Promise.all(order.map((id, i) => supa.from('blocks').update({ position: i }).eq('id', id)));
}

document.addEventListener('dragstart', (e) => {
  const handle = e.target.closest('.drag-handle');
  const wrap = handle && handle.closest('.block-wrap');
  if (!wrap) return;
  draggedBlockId = wrap.dataset.id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', draggedBlockId);
});

document.addEventListener('dragover', (e) => {
  if (!draggedBlockId || !e.target.closest('.block-wrap')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
});

document.addEventListener('dragenter', (e) => {
  const wrap = e.target.closest('.block-wrap');
  if (wrap && draggedBlockId) wrap.classList.add('ring-2', 'ring-white/60');
});

document.addEventListener('dragleave', (e) => {
  const wrap = e.target.closest('.block-wrap');
  if (wrap) wrap.classList.remove('ring-2', 'ring-white/60');
});

document.addEventListener('dragend', () => { draggedBlockId = null; });

document.addEventListener('drop', async (e) => {
  const wrap = e.target.closest('.block-wrap');
  if (!wrap || !draggedBlockId) return;
  e.preventDefault();
  const targetId = wrap.dataset.id;
  const zone = wrap.closest('.zone')?.dataset.zone;
  const dragged = draggedBlockId;
  draggedBlockId = null;
  wrap.classList.remove('ring-2', 'ring-white/60');
  if (!zone || targetId === dragged) return;
  const rect = wrap.getBoundingClientRect();
  const insertAfter = (e.clientY - rect.top) > rect.height / 2;
  await dropBlock(zone, dragged, targetId, insertAfter);
  router();
});

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'login-open') return showModal('login-modal');
  if (action === 'login-close') return hideModal('login-modal');
  if (action === 'logout') return supa.auth.signOut();
  if (action === 'theme-open') return openThemeDrawer();
  if (action === 'theme-close') return closeThemeDrawer();
  if (action === 'theme-save') return saveTheme();

  if (action === 'block-add-start') { addingToZone = btn.dataset.zone; addingType = btn.dataset.type; return router(); }
  if (action === 'block-add-cancel') { addingToZone = null; addingType = null; return router(); }
  if (action === 'block-add-save') {
    const form = btn.closest('.block-form');
    const content = await collectBlockContent(form, btn.dataset.type);
    if (!content) return;
    await supa.from('blocks').insert({ zone: btn.dataset.zone, type: btn.dataset.type, content, position: Date.now() });
    addingToZone = null; addingType = null;
    return router();
  }

  if (action === 'block-edit-start') { editingBlockId = btn.dataset.id; return router(); }
  if (action === 'block-edit-cancel') { editingBlockId = null; return router(); }
  if (action === 'block-edit-save') {
    const form = btn.closest('.block-form');
    const content = await collectBlockContent(form, form.dataset.type);
    if (!content) return;
    await supa.from('blocks').update({ content }).eq('id', btn.dataset.id);
    editingBlockId = null;
    return router();
  }
  if (action === 'block-delete') {
    if (!confirm('Delete this block?')) return;
    await supa.from('blocks').delete().eq('id', btn.dataset.id);
    return router();
  }
  if (action === 'block-move-up' || action === 'block-move-down') {
    await moveBlock(btn.dataset.id, action === 'block-move-up' ? -1 : 1);
    return router();
  }

  // -- projects --
  if (action === 'project-add-start') { addingProject = true; return router(); }
  if (action === 'project-cancel') { addingProject = false; editingProjectId = null; return router(); }
  if (action === 'project-add-save') {
    const form = btn.closest('.block-form');
    const values = await collectProjectForm(form);
    if (!values) return;
    const { data: maxRow } = await supa.from('projects').select('sort_order').order('sort_order', { ascending: false }).limit(1).maybeSingle();
    const { error } = await supa.from('projects').insert({ ...values, sort_order: (maxRow?.sort_order ?? 0) + 1 });
    if (error) { alert('Could not add project: ' + error.message); return; }
    addingProject = false;
    return router();
  }
  if (action === 'project-edit-start') { editingProjectId = btn.dataset.id; return router(); }
  if (action === 'project-edit-save') {
    const form = btn.closest('.block-form');
    const values = await collectProjectForm(form);
    if (!values) return;
    const { error } = await supa.from('projects').update(values).eq('id', btn.dataset.id);
    if (error) { alert('Could not save: ' + error.message); return; }
    editingProjectId = null;
    return router();
  }
  if (action === 'project-delete') {
    if (!confirm('Delete this project? This also deletes its tracklist.')) return;
    await supa.from('projects').delete().eq('id', btn.dataset.id);
    editingProjectId = null;
    location.hash = '#/projects';
    return router();
  }
  if (action === 'project-move-up' || action === 'project-move-down') {
    await moveRow('projects', btn.dataset.id, null, null, 'sort_order', action === 'project-move-up' ? -1 : 1);
    return router();
  }

  // -- project tracks --
  if (action === 'track-add-start') { addingTrackForProject = btn.dataset.projectId; return router(); }
  if (action === 'track-cancel') { addingTrackForProject = null; editingTrackId = null; return router(); }
  if (action === 'track-add-save') {
    const form = btn.closest('.block-form');
    const title = form.querySelector('[data-field="title"]').value.trim();
    if (!title) return;
    const { data: maxRow } = await supa.from('project_tracks').select('position').eq('project_id', btn.dataset.projectId).order('position', { ascending: false }).limit(1).maybeSingle();
    await supa.from('project_tracks').insert({ project_id: btn.dataset.projectId, title, position: (maxRow?.position ?? 0) + 1 });
    addingTrackForProject = null;
    return router();
  }
  if (action === 'track-edit-start') { editingTrackId = btn.dataset.id; return router(); }
  if (action === 'track-edit-save') {
    const form = btn.closest('.block-form');
    const title = form.querySelector('[data-field="title"]').value.trim();
    if (!title) return;
    await supa.from('project_tracks').update({ title }).eq('id', btn.dataset.id);
    editingTrackId = null;
    return router();
  }
  if (action === 'track-delete') {
    if (!confirm('Delete this track?')) return;
    await supa.from('project_tracks').delete().eq('id', btn.dataset.id);
    return router();
  }
  if (action === 'track-move-up' || action === 'track-move-down') {
    const { data: current } = await supa.from('project_tracks').select('project_id').eq('id', btn.dataset.id).single();
    if (current) await moveRow('project_tracks', btn.dataset.id, 'project_id', current.project_id, 'position', action === 'track-move-up' ? -1 : 1);
    return router();
  }

  // -- videos --
  if (action === 'video-add-start') { addingVideo = true; return router(); }
  if (action === 'video-cancel') { addingVideo = false; editingVideoId = null; return router(); }
  if (action === 'video-add-save') {
    const form = btn.closest('.block-form');
    const title = form.querySelector('[data-field="title"]').value.trim();
    const youtube_id = extractYoutubeId(form.querySelector('[data-field="youtube_id"]').value);
    if (!title || !youtube_id) return;
    const { data: maxRow } = await supa.from('videos').select('sort_order').order('sort_order', { ascending: false }).limit(1).maybeSingle();
    await supa.from('videos').insert({ title, youtube_id, sort_order: (maxRow?.sort_order ?? 0) + 1 });
    addingVideo = false;
    return router();
  }
  if (action === 'video-edit-start') { editingVideoId = btn.dataset.id; return router(); }
  if (action === 'video-edit-save') {
    const form = btn.closest('.block-form');
    const title = form.querySelector('[data-field="title"]').value.trim();
    const youtube_id = extractYoutubeId(form.querySelector('[data-field="youtube_id"]').value);
    if (!title || !youtube_id) return;
    await supa.from('videos').update({ title, youtube_id }).eq('id', btn.dataset.id);
    editingVideoId = null;
    return router();
  }
  if (action === 'video-delete') {
    if (!confirm('Delete this video?')) return;
    await supa.from('videos').delete().eq('id', btn.dataset.id);
    return router();
  }
  if (action === 'video-move-up' || action === 'video-move-down') {
    await moveRow('videos', btn.dataset.id, null, null, 'sort_order', action === 'video-move-up' ? -1 : 1);
    return router();
  }

  // -- home page: streaming links --
  if (action === 'streaminglink-add-start') { addingStreamingLink = true; return router(); }
  if (action === 'streaminglink-cancel') { addingStreamingLink = false; editingStreamingLinkId = null; return router(); }
  if (action === 'streaminglink-add-save') {
    const form = btn.closest('.block-form');
    const label = form.querySelector('[data-field="label"]').value.trim();
    const href = form.querySelector('[data-field="href"]').value.trim();
    if (!label || !href) return;
    const { data: maxRow } = await supa.from('streaming_links').select('position').order('position', { ascending: false }).limit(1).maybeSingle();
    await supa.from('streaming_links').insert({ label, href, position: (maxRow?.position ?? 0) + 1 });
    addingStreamingLink = false;
    return router();
  }
  if (action === 'streaminglink-edit-start') { editingStreamingLinkId = btn.dataset.id; return router(); }
  if (action === 'streaminglink-edit-save') {
    const form = btn.closest('.block-form');
    const label = form.querySelector('[data-field="label"]').value.trim();
    const href = form.querySelector('[data-field="href"]').value.trim();
    if (!label || !href) return;
    await supa.from('streaming_links').update({ label, href }).eq('id', btn.dataset.id);
    editingStreamingLinkId = null;
    return router();
  }
  if (action === 'streaminglink-delete') {
    if (!confirm('Delete this link?')) return;
    await supa.from('streaming_links').delete().eq('id', btn.dataset.id);
    return router();
  }
  if (action === 'streaminglink-move-up' || action === 'streaminglink-move-down') {
    await moveRow('streaming_links', btn.dataset.id, null, null, 'position', action === 'streaminglink-move-up' ? -1 : 1);
    return router();
  }

  // -- home page: hero smart-link --
  if (action === 'herolink-edit-start') { editingHeroLink = true; return router(); }
  if (action === 'herolink-cancel') { editingHeroLink = false; return router(); }
  if (action === 'herolink-save') {
    const form = btn.closest('.block-form');
    const hero_link_text = form.querySelector('[data-field="hero_link_text"]').value.trim();
    const hero_link_href = form.querySelector('[data-field="hero_link_href"]').value.trim();
    const { error } = await supa.from('site_theme').update({ hero_link_text, hero_link_href }).eq('id', 1);
    if (error) { alert('Could not save: ' + error.message); return; }
    theme.hero_link_text = hero_link_text;
    theme.hero_link_href = hero_link_href;
    editingHeroLink = false;
    return router();
  }
});

/* ---------- pages ---------- */

async function renderHome() {
  document.title = 'kinrose | stream, merch, stay connected';
  const { data: linksData } = await supa.from('streaming_links').select('*').order('position', { ascending: true });
  const streamingLinks = linksData ?? [];

  const linksDisplay = streamingLinks.map((l, i) =>
    `<a href="${escapeHtml(l.href)}" target="_blank" rel="noreferrer">${escapeHtml(l.label)}</a>${i < streamingLinks.length - 1 ? ' <span>&rarr;</span> ' : ''}`
  ).join('');

  const heroLinkHtml = isAdmin && editingHeroLink
    ? heroLinkForm()
    : `<a class="smart-link" href="${escapeHtml(theme.hero_link_href)}" target="_blank" rel="noreferrer">${escapeHtml(theme.hero_link_text)} &rarr;</a>${isAdmin ? ` <button data-action="herolink-edit-start" class="text-xs px-2 py-0.5 rounded border border-white/30 ml-2 align-middle">Edit</button>` : ''}`;

  const streamingManagerHtml = isAdmin ? `
    <div class="mt-4 flex flex-col gap-2 max-w-md">
      <p class="text-xs uppercase tracking-wide opacity-60">Streaming links</p>
      ${streamingLinks.map((l, i) => editingStreamingLinkId === l.id ? streamingLinkForm(l) : streamingLinkRow(l, i === 0, i === streamingLinks.length - 1)).join('')}
      ${addingStreamingLink ? streamingLinkForm(null) : `<button data-action="streaminglink-add-start" class="px-3 py-1.5 rounded border border-white/30 text-sm w-fit">+ Add streaming link</button>`}
    </div>` : '';

  const zoneHtml = await renderZone('home');
  app.innerHTML = `
    <section class="hero">
      ${heroLinkHtml}
      <h1 class="streaming">${linksDisplay}</h1>
      ${streamingManagerHtml}
    </section>
    <div class="wrap">${zoneHtml}</div>`;
}

async function renderProjectsList() {
  document.title = 'projects — kinrose';
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data, error } = await supa.from('projects').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load projects: ${escapeHtml(error.message)}</p>`; return; }
  const zoneHtml = await renderZone('projects');
  const addUi = isAdmin
    ? (addingProject ? projectForm(null, false) : `<button data-action="project-add-start" class="px-3 py-1.5 rounded border border-white/30 text-sm">+ Add project</button>`)
    : '';
  app.innerHTML = `<section class="list">
    ${addUi}
    ${data.map((p, i) => isAdmin && editingProjectId === p.id ? projectForm(p, false) : projectCard(p, isAdmin, i === 0, i === data.length - 1)).join('')}
    ${zoneHtml}
  </section>`;
}

async function renderProjectDetail(slug) {
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data: projects, error } = await supa.from('projects').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load this project: ${escapeHtml(error.message)}</p>`; return; }

  const i = projects.findIndex((p) => p.slug === slug);
  if (i === -1) { app.innerHTML = '<p class="error">Project not found.</p>'; return; }
  const project = projects[i];
  const prev = projects[i - 1] ?? null;
  const next = projects[i + 1] ?? null;

  document.title = `${project.title} — kinrose`;

  let tracklistHtml = '';
  if (project.show_tracklist) {
    const { data: fetchedTracks } = await supa
      .from('project_tracks')
      .select('*')
      .eq('project_id', project.id)
      .order('position', { ascending: true });
    const tracks = fetchedTracks ?? [];
    const items = tracks.map((t, idx) =>
      isAdmin && editingTrackId === t.id ? trackForm(t, project.id) : trackRow(t, isAdmin, idx === 0, idx === tracks.length - 1)
    ).join('');
    const addTrackUi = isAdmin
      ? (addingTrackForProject === project.id ? trackForm(null, project.id) : `<button data-action="track-add-start" data-project-id="${project.id}" class="px-3 py-1 rounded border border-white/30 text-sm mt-2">+ Add track</button>`)
      : '';
    tracklistHtml = `<ol class="tracklist">${items}</ol>${addTrackUi}`;
  }

  const coverImg = `<img class="cover" src="${escapeHtml(project.cover_image)}" alt="${escapeHtml(project.title)}" />`;
  const coverHtml = project.cover_link
    ? `<a href="${escapeHtml(project.cover_link)}" target="_blank" rel="noreferrer">${coverImg}</a>`
    : coverImg;

  // body_html is hand-authored by us (not user input), so it's safe to insert as trusted markup.
  const bodyHtml = project.body_html ? `<div class="body">${project.body_html}</div>` : '';
  const zoneHtml = await renderZone(`project:${slug}`);

  const isEditingThisProject = isAdmin && editingProjectId === project.id;
  const editUi = isAdmin
    ? (isEditingThisProject ? projectForm(project, true) : `<button data-action="project-edit-start" data-id="${project.id}" class="px-3 py-1.5 rounded border border-white/30 text-sm mb-4">Edit project</button>`)
    : '';
  const headerHtml = isEditingThisProject ? '' : `
      <h1>${escapeHtml(project.title)}</h1>
      <time>${dateFmt(project.released_on, { month: 'short', day: 'numeric' })}</time>
      ${coverHtml}`;

  app.innerHTML = `
    <article class="post">
      ${editUi}
      ${headerHtml}
      ${tracklistHtml}
      ${bodyHtml}
      ${zoneHtml}
      <nav class="pager">
        ${prev ? `<a href="#/projects/${prev.slug}">&larr; ${escapeHtml(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a href="#/projects/${next.slug}">${escapeHtml(next.title)} &rarr;</a>` : '<span></span>'}
      </nav>
    </article>`;
}

async function renderVideos() {
  document.title = 'kinrose videos | video catalog – Watch Now — kinrose';
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data, error } = await supa.from('videos').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load videos: ${escapeHtml(error.message)}</p>`; return; }
  const zoneHtml = await renderZone('videos');
  const addUi = isAdmin
    ? (addingVideo ? videoForm(null) : `<button data-action="video-add-start" class="px-3 py-1.5 rounded border border-white/30 text-sm">+ Add video</button>`)
    : '';
  app.innerHTML = `
    <section class="grid">
      ${data.map((v, i) => isAdmin && editingVideoId === v.id ? videoForm(v) : videoRow(v, isAdmin, i === 0, i === data.length - 1)).join('')}
    </section>
    <div class="wrap">${addUi}</div>
    <div class="wrap">${zoneHtml}</div>`;
}

function router() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [section, param] = hash.split('/');
  if (!section) return renderHome();
  if (section === 'projects' && param) return renderProjectDetail(param);
  if (section === 'projects') return renderProjectsList();
  if (section === 'videos') return renderVideos();
  app.innerHTML = '<p class="error">Page not found.</p>';
}

window.addEventListener('hashchange', router);

(async function init() {
  await fetchTheme();
  await refreshAdminState();
  renderAdminChrome();
  router();
})();

// newsletter signup -> writes straight to Supabase (anon key can only INSERT, per schema.sql RLS)
const form = document.getElementById('newsletter-form');
const status = document.getElementById('newsletter-status');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const email = String(data.get('email') || '').trim();
  if (!email) return;
  status.textContent = 'Signing up...';
  const { error } = await supa.from('newsletter_signups').insert({
    first_name: String(data.get('first_name') || '').trim() || null,
    last_name: String(data.get('last_name') || '').trim() || null,
    email,
  });
  if (error) {
    status.textContent = error.code === '23505' ? "You're already signed up. Thank you!" : 'Something went wrong, please try again.';
    return;
  }
  status.textContent = 'Thank you!';
  form.reset();
});
</script>
