<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="favicon.ico" />
<title>kinrose | stream, merch, stay connected</title>
<meta name="description" content="Explore Kinrose's projects and videos. Stay updated with the latest news by signing up for our newsletter." />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Only use Tailwind for utility classes in the new admin UI -- disable its CSS
  // reset so it can't override the hand-written styles above for the public site.
  tailwind.config = { corePlugins: { preflight: false } };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Space+Grotesk&family=DM+Serif+Display&family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #583b1f;
    --text: #eae6e1;
    --text-dim: #cbb9a3;
    --card-bg: #6b4b29;
    --radius: 8px;
    --font-heading: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    --max-width: 960px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.75; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: 600; letter-spacing: -0.01em; }

  /* nav */
  .nav { padding: 20px 0; }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; }
  .nav-inner img { height: 32px; width: auto; }
  .nav nav { display: flex; gap: 24px; font-size: 0.95rem; text-transform: lowercase; align-items: center; }
  .nav nav a { opacity: 0.85; }

  /* home */
  .hero { padding: 80px 24px; display: flex; flex-direction: column; gap: 32px; }
  .smart-link { display: inline-block; font-size: 0.9rem; text-transform: lowercase; border-bottom: 1px solid currentColor; width: fit-content; }
  .streaming { font-size: clamp(1.5rem, 5vw, 2.5rem); line-height: 1.4; }
  .streaming a { border-bottom: 2px solid transparent; }
  .streaming a:hover { border-bottom-color: currentColor; opacity: 1; }

  /* project list */
  .list { padding: 48px 24px; display: flex; flex-direction: column; gap: 32px; }
  .entry { background: var(--card-bg); border-radius: var(--radius); padding: 20px; }
  .entry img { max-width: 320px; margin-bottom: 16px; border-radius: var(--radius); }
  time { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }
  .entry h2 { margin: 0 0 8px; font-size: 1.6rem; text-transform: lowercase; }
  .more { font-size: 0.85rem; border-bottom: 1px solid currentColor; width: fit-content; display: inline-block; }

  /* project detail */
  .post { padding: 48px 24px; max-width: 640px; margin: 0 auto; }
  .post h1 { text-transform: lowercase; font-size: 2rem; margin-bottom: 4px; }
  .post .cover { margin-bottom: 24px; border-radius: var(--radius); }
  .tracklist { padding-left: 1.2em; margin-bottom: 24px; }
  .tracklist li { margin-bottom: 4px; }
  .body p { margin-bottom: 1.2em; }
  .body .credit { font-size: 0.9rem; color: var(--text-dim); margin-top: -8px; }
  .body .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 16px 0 24px; }
  .body .gallery img { border-radius: var(--radius); }
  .body img { border-radius: var(--radius); margin: 16px 0; }
  .body a { border-bottom: 1px solid currentColor; }
  .pager { display: flex; justify-content: space-between; margin-top: 48px; padding-top: 24px; border-top: 1px solid rgba(234, 230, 225, 0.2); font-size: 0.9rem; }

  /* videos */
  .grid { padding: 48px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  .video { background: var(--card-bg); border-radius: var(--radius); padding: 12px; }
  .frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: var(--radius); overflow: hidden; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video p { margin: 10px 0 0; font-size: 0.9rem; }

  /* newsletter */
  .newsletter { padding: 48px 24px 64px; border-top: 1px solid rgba(234, 230, 225, 0.2); margin-top: 64px; }
  .newsletter form { display: flex; flex-wrap: wrap; gap: 12px; max-width: 480px; }
  .newsletter label { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; flex: 1 1 140px; }
  .newsletter input { padding: 8px 10px; border: 1px solid rgba(234, 230, 225, 0.4); background: transparent; color: var(--text); border-radius: 4px; font-size: 0.95rem; }
  .newsletter button { padding: 8px 20px; border: 1px solid var(--text); background: var(--text); color: var(--bg); border-radius: 4px; cursor: pointer; font-size: 0.95rem; align-self: flex-end; }
  .newsletter button:hover { opacity: 0.85; }
  #newsletter-status { width: 100%; font-size: 0.85rem; min-height: 1.2em; }

  .loading, .error { padding: 48px 24px; color: var(--text-dim); }

  /* content blocks + admin UI (Tailwind-assisted) */
  .zone { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
  .block-wrap { position: relative; }
  .block-text p { margin: 0 0 0.8em; }
  .card { background: var(--card-bg); border-radius: var(--radius); padding: 20px; }
  .card img { border-radius: var(--radius); margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; text-transform: lowercase; }
  .block-image { border-radius: var(--radius); }

  input[type=color] { -webkit-appearance: none; border: none; width: 36px; height: 36px; border-radius: 6px; padding: 0; background: none; }
  input[type=color]::-webkit-color-swatch { border-radius: 6px; border: 1px solid rgba(0,0,0,0.2); }

  /* Tailwind's "flex" utility on the modals ties with the native [hidden] rule in specificity
     and wins (author styles beat the browser's UA default either way) -- force hidden to actually hide. */
  [hidden] { display: none !important; }
</style>
</head>
<body class="bg-[var(--bg)]">

<div id="admin-banner" class="fixed top-0 left-0 w-full z-[60] bg-amber-400 text-amber-950 text-sm text-center py-2 px-4" hidden>
  You're viewing the admin version of this site — changes here go live for everyone.
  <a href="#" data-action="logout" class="underline ml-2">Log out</a>
</div>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="#/"><img src="images/logo.png" alt="kinrose" /></a>
    <nav>
      <a href="#/projects">projects</a>
      <a href="#/videos">videos</a>
      <span id="admin-nav-slot" class="flex gap-4"></span>
    </nav>

</header>

<main id="app" class="wrap"><p class="loading">Loading...</p></main>

<footer class="newsletter wrap">
  <h2>Get updates</h2>

  <form id="newsletter-form">
    <label>First Name<input type="text" name="first_name" placeholder="First Name" /></label>
    <label>Last Name<input type="text" name="last_name" placeholder="Last Name" /></label>
    <label>Email Address<input type="email" name="email" placeholder="Email Address" required /></label>
    <button type="submit">Sign Up</button>
    <p id="newsletter-status" role="status"></p>
  </form>
</footer>

<!-- admin: login modal -->
<div id="login-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" hidden>
  <div class="bg-[var(--card-bg)] text-[var(--text)] rounded-lg p-6 w-full max-w-sm">
    <h2 class="text-lg mb-4 lowercase">admin login</h2>
    <form id="login-form" class="flex flex-col gap-3">
      <label class="flex flex-col gap-1 text-sm">
        Email
        <input type="email" name="email" required class="px-3 py-2 rounded bg-transparent border border-white/30 text-[var(--text)]" />
      </label>

      </div>

  </div>
</div>

<!-- admin: theme settings drawer -- edits preview live on the page; "Save" is what persists them -->
<div id="theme-drawer" class="fixed top-0 right-0 h-full w-80 max-w-full bg-[var(--card-bg)] text-[var(--text)] shadow-2xl z-50 transform translate-x-full transition-transform duration-300 overflow-y-auto p-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg lowercase">site theme</h2>
    <button type="button" data-action="theme-close" class="text-2xl leading-none px-2">&times;</button>
  </div>
  <div>
    <div class="grid grid-cols-2 gap-4">
      <label class="flex items-center justify-between text-sm">Background <input type="color" id="theme-bg" /></label>
      <label class="flex items-center justify-between text-sm">Text <input type="color" id="theme-text" /></label>
      <label class="flex items-center justify-between text-sm">Muted text <input type="color" id="theme-text-dim" /></label>
      <label class="flex items-center justify-between text-sm">Card background <input type="color" id="theme-card-bg" /></label>
    </div>
    <label class="flex flex-col gap-1 text-sm mt-4">
      Corner roundness
      <select id="theme-radius" class="px-3 py-2 rounded bg-[var(--bg)] border border-white/30">
        <option value="0px">None</option>
        <option value="4px">Small</option>
        <option value="10px">Medium</option>
        <option value="20px">Large</option>
      </select>
    </label>
    <label class="flex flex-col gap-1 text-sm mt-4">
      Heading font
      <select id="theme-heading-font" class="px-3 py-2 rounded bg-[var(--bg)] border border-white/30">
        <option value="system">System default</option>
        <option value="playfair">Playfair Display</option>
        <option value="spacegrotesk">Space Grotesk</option>
        <option value="dmserif">DM Serif Display</option>
        <option value="inter">Inter</option>
        <option value="poppins">Poppins</option>
      </select>
    </label>
    <label class="flex flex-col gap-1 text-sm mt-4">
      Body font
      <select id="theme-body-font" class="px-3 py-2 rounded bg-[var(--bg)] border border-white/30">
        <option value="system">System default</option>
        <option value="inter">Inter</option>
        <option value="poppins">Poppins</option>
        <option value="spacegrotesk">Space Grotesk</option>
      </select>
    </label>
    <div class="sticky bottom-0 bg-[var(--card-bg)] pt-4 mt-6 -mx-6 px-6 -mb-6 pb-6">
      <button type="button" data-action="theme-save" class="w-full px-4 py-2 rounded bg-[var(--text)] text-[var(--bg)]">Save for everyone</button>
      <p id="theme-save-status" class="text-xs text-center mt-2 min-h-[1em] opacity-80"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dateFmt(iso, opts) {
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-US', opts);
}

function showModal(id) { document.getElementById(id).hidden = false; }
function hideModal(id) { document.getElementById(id).hidden = true; }

/* ---------- theme ---------- */

const FONT_STACKS = {
  system: "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif",
  playfair: "'Playfair Display', serif",
  spacegrotesk: "'Space Grotesk', sans-serif",
  dmserif: "'DM Serif Display', serif",
  inter: "'Inter', sans-serif",
  poppins: "'Poppins', sans-serif",
};

const DEFAULT_THEME = {
  bg_color: '#583b1f', text_color: '#eae6e1', text_dim_color: '#cbb9a3',
  card_bg_color: '#6b4b29', radius: '8px', heading_font: 'system', body_font: 'system',
};

let theme = DEFAULT_THEME;

function applyTheme(t) {
  const root = document.documentElement;
  root.style.setProperty('--bg', t.bg_color);
  root.style.setProperty('--text', t.text_color);
  root.style.setProperty('--text-dim', t.text_dim_color);
  root.style.setProperty('--card-bg', t.card_bg_color);
  root.style.setProperty('--radius', t.radius);
  root.style.setProperty('--font-heading', FONT_STACKS[t.heading_font] || FONT_STACKS.system);
  root.style.setProperty('--font-body', FONT_STACKS[t.body_font] || FONT_STACKS.system);
}

async function fetchTheme() {
  const { data } = await supa.from('site_theme').select('*').eq('id', 1).maybeSingle();
  theme = data || DEFAULT_THEME;
  applyTheme(theme);
}

const THEME_FIELD_IDS = ['theme-bg', 'theme-text', 'theme-text-dim', 'theme-card-bg', 'theme-radius', 'theme-heading-font', 'theme-body-font'];

function readThemeForm() {
  return {
    bg_color: document.getElementById('theme-bg').value,
    text_color: document.getElementById('theme-text').value,
    text_dim_color: document.getElementById('theme-text-dim').value,
    card_bg_color: document.getElementById('theme-card-bg').value,
    radius: document.getElementById('theme-radius').value,
    heading_font: document.getElementById('theme-heading-font').value,
    body_font: document.getElementById('theme-body-font').value,
  };
}

// Every field change previews instantly on the live page -- nothing is saved until "Save for everyone".
function previewTheme() {
  applyTheme(readThemeForm());
}

THEME_FIELD_IDS.forEach((id) => {
  const el = document.getElementById(id);
  el.addEventListener('input', previewTheme);
  el.addEventListener('change', previewTheme);
});

function openThemeDrawer() {
  document.getElementById('theme-bg').value = theme.bg_color;
  document.getElementById('theme-text').value = theme.text_color;
  document.getElementById('theme-text-dim').value = theme.text_dim_color;
  document.getElementById('theme-card-bg').value = theme.card_bg_color;
  document.getElementById('theme-radius').value = theme.radius;
  document.getElementById('theme-heading-font').value = theme.heading_font;
  document.getElementById('theme-body-font').value = theme.body_font;
  document.getElementById('theme-drawer').classList.remove('translate-x-full');
}

function closeThemeDrawer() {
  applyTheme(theme); // discard any unsaved live preview, revert to what's actually saved
  document.getElementById('theme-drawer').classList.add('translate-x-full');
}

async function saveTheme() {
  const updated = readThemeForm();
  const statusEl = document.getElementById('theme-save-status');
  const { error } = await supa.from('site_theme').update(updated).eq('id', 1);
  if (error) { statusEl.textContent = 'Could not save: ' + error.message; return; }
  theme = updated;
  applyTheme(theme);
  statusEl.textContent = 'Saved.';
  setTimeout(() => { statusEl.textContent = ''; }, 2000);
}

/* ---------- admin / auth ---------- */

let isAdmin = false;

async function refreshAdminState() {
  const { data: sessionData } = await supa.auth.getSession();
  if (!sessionData.session) { isAdmin = false; return; }
  const { data, error } = await supa.rpc('is_admin');
  isAdmin = !error && data === true;
}

function renderAdminChrome() {
  const slot = document.getElementById('admin-nav-slot');
  if (slot) {
    slot.innerHTML = isAdmin
      ? `<a href="#" data-action="theme-open">theme</a><a href="#" data-action="logout">logout</a>`
      : `<a href="#" data-action="login-open">admin</a>`;
  }
  const banner = document.getElementById('admin-banner');
  if (banner) {
    banner.hidden = !isAdmin;
    document.body.classList.toggle('pt-9', isAdmin);
  }
}

supa.auth.onAuthStateChange(async () => {
  await refreshAdminState();
  renderAdminChrome();
  router();
});

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const { error } = await supa.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
  const err = document.getElementById('login-error');
  if (error) { err.textContent = error.message; return; }
  err.textContent = '';
  e.target.reset();
  hideModal('login-modal');
});

/* ---------- content blocks ---------- */

let editingBlockId = null;
let addingToZone = null;
let addingType = null;

async function fetchBlocks(zone) {
  const { data, error } = await supa.from('blocks').select('*').eq('zone', zone).order('position', { ascending: true });
  return error ? [] : (data ?? []);
}

async function collectBlockContent(form, type) {
  const get = (name) => form.querySelector(`[data-field="${name}"]`);
  const fileInput = get('file');
  let uploadedUrl = null;
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    const path = `${Date.now()}-${file.name}`.replace(/\s+/g, '-');
    const { error: upErr } = await supa.storage.from('site-images').upload(path, file, { upsert: true });
    if (upErr) { alert('Image upload failed: ' + upErr.message); return null; }
    uploadedUrl = supa.storage.from('site-images').getPublicUrl(path).data.publicUrl;
  }
  if (type === 'text') {
    return { text: (get('text')?.value || '').trim() };
  }
  if (type === 'image') {
    return { url: uploadedUrl || (get('url')?.value || '').trim(), alt: (get('alt')?.value || '').trim() };
  }
  return {
    title: (get('title')?.value || '').trim(),
    body: (get('body')?.value || '').trim(),
    image_url: uploadedUrl || (get('image_url')?.value || '').trim(),
  };
}

function blockFormFields(type, c) {
  c = c || {};
  if (type === 'text') {
    return `<textarea data-field="text" rows="4" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)]" placeholder="Text...">${escapeHtml(c.text || '')}</textarea>`;
  }
  if (type === 'image') {
    return `
      <input data-field="url" type="text" value="${escapeHtml(c.url || '')}" placeholder="Image URL (or upload a file below)" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />
      <input data-field="file" type="file" accept="image/*" class="w-full text-sm mb-2" />
      <input data-field="alt" type="text" value="${escapeHtml(c.alt || '')}" placeholder="Alt text" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)]" />`;
  }
  return `
    <input data-field="title" type="text" value="${escapeHtml(c.title || '')}" placeholder="Card title" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />
    <textarea data-field="body" rows="3" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" placeholder="Card text">${escapeHtml(c.body || '')}</textarea>
    <input data-field="image_url" type="text" value="${escapeHtml(c.image_url || '')}" placeholder="Image URL (optional)" class="w-full px-3 py-2 rounded bg-[var(--bg)] border border-white/30 text-[var(--text)] mb-2" />
    <input data-field="file" type="file" accept="image/*" class="w-full text-sm" />`;
}

// Shared renderer: used both for a saved block's normal view AND for the live preview
// inside an add/edit form, so the preview always matches exactly what will be saved.
function renderBlockContent(type, content) {
  content = content || {};
  if (type === 'text') {
    const paras = (content.text || '').split('\n').filter(Boolean).map((l) => `<p>${escapeHtml(l)}</p>`).join('');
    return `<div class="block-text">${paras || '<p class="opacity-50 text-sm">(empty)</p>'}</div>`;
  }
  if (type === 'image') {
    return content.url
      ? `<img src="${escapeHtml(content.url)}" alt="${escapeHtml(content.alt || '')}" class="block-image" />`
      : '<p class="opacity-50 text-sm">No image yet</p>';
  }
  return `<div class="card">
    ${content.image_url ? `<img src="${escapeHtml(content.image_url)}" alt="" />` : ''}
    ${content.title ? `<h3>${escapeHtml(content.title)}</h3>` : ''}
    ${content.body ? `<p>${escapeHtml(content.body)}</p>` : ''}
    ${!content.image_url && !content.title && !content.body ? '<p class="opacity-50 text-sm">(empty card)</p>' : ''}
  </div>`;
}

function readBlockFormValuesForPreview(form, type) {
  const get = (name) => form.querySelector(`[data-field="${name}"]`);
  const fileInput = get('file');
  const filePreviewUrl = fileInput && fileInput.files && fileInput.files[0] ? URL.createObjectURL(fileInput.files[0]) : null;
  if (type === 'text') return { text: get('text')?.value || '' };
  if (type === 'image') return { url: filePreviewUrl || (get('url')?.value || ''), alt: get('alt')?.value || '' };
  return {
    title: get('title')?.value || '',
    body: get('body')?.value || '',
    image_url: filePreviewUrl || (get('image_url')?.value || ''),
  };
}

// Live-updates a form's preview as any of its fields change -- nothing is saved here.
document.addEventListener('input', handleBlockFormLivePreview);
document.addEventListener('change', handleBlockFormLivePreview);
function handleBlockFormLivePreview(e) {
  const form = e.target.closest('.block-form');
  if (!form) return;
  const preview = form.querySelector('.block-preview');
  if (!preview) return;
  preview.innerHTML = renderBlockContent(form.dataset.type, readBlockFormValuesForPreview(form, form.dataset.type));
}

function blockAddForm(zone, type) {
  return `<div class="block-form p-4 rounded border border-dashed border-white/40" data-type="${type}">
    <p class="text-xs uppercase tracking-wide opacity-60 mb-1">Preview</p>
    <div class="block-preview mb-3">${renderBlockContent(type, null)}</div>
    ${blockFormFields(type, null)}
    <div class="flex gap-2 justify-end mt-3">
      <button data-action="block-add-cancel" class="px-3 py-1.5 rounded border border-white/30 text-sm">Cancel</button>
      <button data-action="block-add-save" data-zone="${escapeHtml(zone)}" data-type="${type}" class="px-3 py-1.5 rounded bg-[var(--text)] text-[var(--bg)] text-sm">Save</button>
    </div>
  </div>`;
}

function blockEditForm(b) {
  return `<div class="block-form p-4 rounded border border-dashed border-white/40" data-type="${b.type}">
    <p class="text-xs uppercase tracking-wide opacity-60 mb-1">Preview</p>
    <div class="block-preview mb-3">${renderBlockContent(b.type, b.content)}</div>
    ${blockFormFields(b.type, b.content)}
    <div class="flex gap-2 justify-end mt-3">
      <button data-action="block-edit-cancel" class="px-3 py-1.5 rounded border border-white/30 text-sm">Cancel</button>
      <button data-action="block-edit-save" data-id="${b.id}" class="px-3 py-1.5 rounded bg-[var(--text)] text-[var(--bg)] text-sm">Save</button>
    </div>
  </div>`;
}

function renderBlockView(b, isFirst, isLast) {
  const inner = renderBlockContent(b.type, b.content);
  const controls = isAdmin ? `
    <div class="flex gap-2 mt-2 text-xs opacity-80">
      <button data-action="block-move-up" data-id="${b.id}" class="px-2 py-1 rounded border border-white/30" ${isFirst ? 'disabled' : ''}>&uarr;</button>
      <button data-action="block-move-down" data-id="${b.id}" class="px-2 py-1 rounded border border-white/30" ${isLast ? 'disabled' : ''}>&darr;</button>
      <button data-action="block-edit-start" data-id="${b.id}" class="px-2 py-1 rounded border border-white/30">Edit</button>
      <button data-action="block-delete" data-id="${b.id}" class="px-2 py-1 rounded border border-white/30">Delete</button>
    </div>` : '';
  return `<div class="block-wrap" data-id="${b.id}">${inner}${controls}</div>`;
}

async function renderZone(zone) {
  const list = await fetchBlocks(zone);
  let html = `<div class="zone" data-zone="${escapeHtml(zone)}">`;
  list.forEach((b, i) => {
    html += isAdmin && editingBlockId === b.id
      ? blockEditForm(b)
      : renderBlockView(b, i === 0, i === list.length - 1);
  });
  if (isAdmin) {
    html += addingToZone === zone
      ? blockAddForm(zone, addingType)
      : `<div class="flex gap-2 text-xs opacity-80">
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="text" class="px-3 py-1.5 rounded border border-white/30">+ Text</button>
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="image" class="px-3 py-1.5 rounded border border-white/30">+ Image</button>
          <button data-action="block-add-start" data-zone="${escapeHtml(zone)}" data-type="card" class="px-3 py-1.5 rounded border border-white/30">+ Card</button>
        </div>`;
  }
  html += '</div>';
  return html;
}

async function moveBlock(id, dir) {
  const { data: current } = await supa.from('blocks').select('zone').eq('id', id).single();
  if (!current) return;
  const { data: siblings } = await supa.from('blocks').select('id, position').eq('zone', current.zone).order('position', { ascending: true });
  const idx = siblings.findIndex((s) => s.id === id);
  const swapIdx = idx + dir;
  if (swapIdx < 0 || swapIdx >= siblings.length) return;
  const a = siblings[idx], b = siblings[swapIdx];
  await supa.from('blocks').update({ position: b.position }).eq('id', a.id);
  await supa.from('blocks').update({ position: a.position }).eq('id', b.id);
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'login-open') return showModal('login-modal');
  if (action === 'login-close') return hideModal('login-modal');
  if (action === 'logout') return supa.auth.signOut();
  if (action === 'theme-open') return openThemeDrawer();
  if (action === 'theme-close') return closeThemeDrawer();
  if (action === 'theme-save') return saveTheme();

  if (action === 'block-add-start') { addingToZone = btn.dataset.zone; addingType = btn.dataset.type; return router(); }
  if (action === 'block-add-cancel') { addingToZone = null; addingType = null; return router(); }
  if (action === 'block-add-save') {
    const form = btn.closest('.block-form');
    const content = await collectBlockContent(form, btn.dataset.type);
    if (!content) return;
    await supa.from('blocks').insert({ zone: btn.dataset.zone, type: btn.dataset.type, content, position: Date.now() });
    addingToZone = null; addingType = null;
    return router();
  }

  if (action === 'block-edit-start') { editingBlockId = btn.dataset.id; return router(); }
  if (action === 'block-edit-cancel') { editingBlockId = null; return router(); }
  if (action === 'block-edit-save') {
    const form = btn.closest('.block-form');
    const content = await collectBlockContent(form, form.dataset.type);
    if (!content) return;
    await supa.from('blocks').update({ content }).eq('id', btn.dataset.id);
    editingBlockId = null;
    return router();
  }
  if (action === 'block-delete') {
    if (!confirm('Delete this block?')) return;
    await supa.from('blocks').delete().eq('id', btn.dataset.id);
    return router();
  }
  if (action === 'block-move-up' || action === 'block-move-down') {
    await moveBlock(btn.dataset.id, action === 'block-move-up' ? -1 : 1);
    return router();
  }
});

async function renderProjectsList() {
  document.title = 'projects — kinrose';
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data, error } = await supa.from('projects').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load projects: ${escapeHtml(error.message)}</p>`; return; }
  const zoneHtml = await renderZone('projects');
  app.innerHTML = `<section class="list">${data.map((p) => `
    <article class="entry">
      <time>${dateFmt(p.released_on, { month: 'numeric', day: 'numeric', year: '2-digit' })}</time>
      <a href="#/projects/${p.slug}">
        <img src="${escapeHtml(p.cover_image)}" alt="${escapeHtml(p.title)}" />
        <h2>${escapeHtml(p.title)}</h2>
      </a>
      <a class="more" href="#/projects/${p.slug}">Read More</a>
    </article>`).join('')}${zoneHtml}</section>`;
}

async function renderProjectDetail(slug) {
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data: projects, error } = await supa.from('projects').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load this project: ${escapeHtml(error.message)}</p>`; return; }

  const i = projects.findIndex((p) => p.slug === slug);
  if (i === -1) { app.innerHTML = '<p class="error">Project not found.</p>'; return; }
  const project = projects[i];
  const prev = projects[i - 1] ?? null;
  const next = projects[i + 1] ?? null;

  document.title = `${project.title} — kinrose`;

  let tracklistHtml = '';
  if (project.show_tracklist) {
    const { data: tracks } = await supa
      .from('project_tracks')
      .select('position, title')
      .eq('project_id', project.id)
      .order('position', { ascending: true });
    tracklistHtml = `<ol class="tracklist">${(tracks ?? []).map((t) => `<li>${escapeHtml(t.title)}</li>`).join('')}</ol>`;
  }

  const coverImg = `<img class="cover" src="${escapeHtml(project.cover_image)}" alt="${escapeHtml(project.title)}" />`;
  const coverHtml = project.cover_link
    ? `<a href="${escapeHtml(project.cover_link)}" target="_blank" rel="noreferrer">${coverImg}</a>`
    : coverImg;

  // body_html is hand-authored by us (not user input), so it's safe to insert as trusted markup.
  const bodyHtml = project.body_html ? `<div class="body">${project.body_html}</div>` : '';
  const zoneHtml = await renderZone(`project:${slug}`);

  app.innerHTML = `
    <article class="post">
      <h1>${escapeHtml(project.title)}</h1>
      <time>${dateFmt(project.released_on, { month: 'short', day: 'numeric' })}</time>
      ${coverHtml}
      ${tracklistHtml}
      ${bodyHtml}
      ${zoneHtml}
      <nav class="pager">
        ${prev ? `<a href="#/projects/${prev.slug}">&larr; ${escapeHtml(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a href="#/projects/${next.slug}">${escapeHtml(next.title)} &rarr;</a>` : '<span></span>'}
      </nav>
    </article>`;
}

async function renderVideos() {
  document.title = 'kinrose videos | video catalog – Watch Now — kinrose';
  app.innerHTML = '<p class="loading">Loading...</p>';
  const { data, error } = await supa.from('videos').select('*').order('sort_order', { ascending: true });
  if (error) { app.innerHTML = `<p class="error">Could not load videos: ${escapeHtml(error.message)}</p>`; return; }
  const zoneHtml = await renderZone('videos');
  app.innerHTML = `<section class="grid">${data.map((v) => `
    <div class="video">
      <div class="frame">
        <iframe src="https://www.youtube.com/embed/${encodeURIComponent(v.youtube_id)}" title="${escapeHtml(v.title)}" loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
      <p>${escapeHtml(v.title)}</p>
    </div>`).join('')}</section><div class="wrap">${zoneHtml}</div>`;
}

function router() {
  const hash = location.hash.replace(/^#\/?/, '');
  const [section, param] = hash.split('/');
  if (!section) return renderHome();
  if (section === 'projects' && param) return renderProjectDetail(param);
  if (section === 'projects') return renderProjectsList();
  if (section === 'videos') return renderVideos();
  app.innerHTML = '<p class="error">Page not found.</p>';
}

window.addEventListener('hashchange', router);

(async function init() {
  await fetchTheme();
  await refreshAdminState();
  renderAdminChrome();
  router();
})();

// newsletter signup -> writes straight to Supabase (anon key can only INSERT, per schema.sql RLS)
const form = document.getElementById('newsletter-form');
const status = document.getElementById('newsletter-status');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = new FormData(form);
  const email = String(data.get('email') || '').trim();
  if (!email) return;
  status.textContent = 'Signing up...';
  const { error } = await supa.from('newsletter_signups').insert({
    first_name: String(data.get('first_name') || '').trim() || null,
    last_name: String(data.get('last_name') || '').trim() || null,
    email,
  });
  if (error) {
    status.textContent = error.code === '23505' ? "You're already signed up. Thank you!" : 'Something went wrong, please try again.';
    return;
  }
  status.textContent = 'Thank you!';
  form.reset();
});
